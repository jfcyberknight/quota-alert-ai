name: CI/CD Deployment

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Set Vercel env vars
        run: |
          printf "${{ secrets.VAPID_PUBLIC_KEY }}"  | npx vercel env add VAPID_PUBLIC_KEY  production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_VAPID_PUBLIC_KEY }}" | npx vercel env add VITE_VAPID_PUBLIC_KEY production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VAPID_PRIVATE_KEY }}" | npx vercel env add VAPID_PRIVATE_KEY production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.CRON_SECRET }}"       | npx vercel env add CRON_SECRET       production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUOTA_ALERT_AI_JV }}" | npx vercel env add FIREBASE_SERVICE_ACCOUNT production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_API_KEY }}" | npx vercel env add VITE_FIREBASE_API_KEY production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" | npx vercel env add VITE_FIREBASE_AUTH_DOMAIN production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" | npx vercel env add VITE_FIREBASE_PROJECT_ID production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" | npx vercel env add VITE_FIREBASE_STORAGE_BUCKET production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" | npx vercel env add VITE_FIREBASE_MESSAGING_SENDER_ID production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
          printf "${{ secrets.VITE_FIREBASE_APP_ID }}" | npx vercel env add VITE_FIREBASE_APP_ID production --token=${{ secrets.VERCEL_TOKEN }} --force 2>/dev/null || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project quota-alert-ai-jv --token=${{ secrets.FIREBASE_TOKEN }} --non-interactive
