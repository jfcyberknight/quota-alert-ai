name: CI/CD Deployment

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Set Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUOTA_ALERT_AI_JV }}
          VAPID_PUB: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIV: ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SEC: ${{ secrets.CRON_SECRET }}
        run: |
          printf %s "$SA_JSON" | npx vercel env add FIREBASE_SERVICE_ACCOUNT production --token=$VERCEL_TOKEN --force
          printf %s "$VAPID_PUB" | npx vercel env add VAPID_PUBLIC_KEY production --token=$VERCEL_TOKEN --force
          printf %s "$VAPID_PRIV" | npx vercel env add VAPID_PRIVATE_KEY production --token=$VERCEL_TOKEN --force
          printf %s "$CRON_SEC" | npx vercel env add CRON_SECRET production --token=$VERCEL_TOKEN --force
          # Les variables VITE_* sont statiques et devraient être gérées dans le dashboard Vercel pour gagner du temps en CI.


      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project quota-alert-ai-jv --token=${{ secrets.FIREBASE_TOKEN }} --non-interactive
